<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Position Builder</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e0e0e;
    color: #e0e0e0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* ===== TOP TOOLBAR ===== */
.toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #161616;
    border-bottom: 1px solid #2a2a2a;
    flex-shrink: 0;
    flex-wrap: wrap;
}

.toolbar-title {
    color: #5499ff;
    font-weight: 600;
    font-size: 13px;
    margin-right: 8px;
}

.currency-group {
    display: flex;
    border: 1px solid #333;
    border-radius: 4px;
    overflow: hidden;
}

.currency-btn {
    padding: 5px 10px;
    background: #222;
    color: #888;
    border: none;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.15s;
}

.currency-btn.active {
    background: #2c3e50;
    color: #5499ff;
}

.view-select {
    background: #222;
    border: 1px solid #333;
    color: #ccc;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
}

.recenter-btn {
    padding: 5px 10px;
    background: #222;
    border: 1px solid #333;
    color: #888;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
}

.recenter-btn:hover { background: #2a2a2a; }

/* Time slider area */
.time-section {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 300px;
}

.date-badge {
    background: #1a2535;
    border: 1px solid #5499ff;
    color: #5499ff;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    white-space: nowrap;
    cursor: pointer;
}

.time-slider-track {
    flex: 1;
    position: relative;
    height: 4px;
    background: #2a2a2a;
    border-radius: 2px;
}

.time-slider-track input[type=range] {
    position: absolute;
    width: 100%;
    height: 4px;
    top: 0;
    left: 0;
    opacity: 1;
    -webkit-appearance: none;
    background: transparent;
    cursor: pointer;
}

.time-slider-track input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #5499ff;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(84,153,255,0.5);
}

.shift-group {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    font-size: 11px;
    color: #888;
}

.shift-group span { min-width: 30px; }

.shift-slider {
    width: 100px;
    height: 4px;
    -webkit-appearance: none;
    background: #2a2a2a;
    border-radius: 2px;
    cursor: pointer;
}

.shift-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #5499ff;
    cursor: pointer;
}

.shift-value { color: #ccc; min-width: 38px; text-align: right; }

/* ===== MAIN LAYOUT ===== */
.main {
    display: flex;
    flex: 1;
    overflow: hidden;
}

/* ===== LEFT PANEL ===== */
.left-panel {
    width: 260px;
    flex-shrink: 0;
    background: #161616;
    border-right: 1px solid #2a2a2a;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 10px;
    overflow-y: auto;
}

.panel-label {
    font-size: 10px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 2px;
}

/* Date filter tabs */
.date-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
}

.date-tab {
    padding: 3px 7px;
    background: #222;
    border: 1px solid #333;
    color: #888;
    border-radius: 3px;
    font-size: 10px;
    cursor: pointer;
    white-space: nowrap;
}

.date-tab.active {
    background: #1a2535;
    border-color: #5499ff;
    color: #5499ff;
}

/* Instrument search */
.search-input {
    width: 100%;
    background: #222;
    border: 1px solid #333;
    color: #ddd;
    padding: 7px 10px;
    border-radius: 4px;
    font-size: 12px;
}

.search-input:focus { outline: none; border-color: #5499ff; }

.instrument-list {
    flex: 1;
    overflow-y: auto;
    border: 1px solid #2a2a2a;
    border-radius: 4px;
    max-height: 180px;
}

.instrument-item {
    padding: 7px 10px;
    font-size: 12px;
    cursor: pointer;
    color: #ccc;
    border-bottom: 1px solid #1f1f1f;
    white-space: nowrap;
}

.instrument-item:hover { background: #232323; }
.instrument-item.selected { background: #1a2535; color: #5499ff; }

/* Amount + long/short */
.amount-row {
    display: flex;
    gap: 8px;
    align-items: center;
}

.amount-input {
    flex: 1;
    background: #222;
    border: 1px solid #333;
    color: #ddd;
    padding: 7px 10px;
    border-radius: 4px;
    font-size: 12px;
}

.amount-input:focus { outline: none; border-color: #5499ff; }

.btn-long {
    flex: 1;
    padding: 9px;
    background: #2a5c2a;
    border: 1px solid #3d8c3d;
    color: #4CAF50;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.15s;
}
.btn-long:hover { background: #316631; }

.btn-short {
    flex: 1;
    padding: 9px;
    background: #5c2a2a;
    border: 1px solid #8c3d3d;
    color: #f44336;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.15s;
}
.btn-short:hover { background: #663131; }

/* ===== RIGHT PANEL ===== */
.right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* Chart */
.chart-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #0e0e0e;
}

#pnlChart {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
}

/* Table */
.table-wrap {
    height: 200px;
    flex-shrink: 0;
    border-top: 1px solid #2a2a2a;
    overflow-y: auto;
    background: #111;
}

table {
    width: 100%;
    font-size: 11px;
    border-collapse: collapse;
    min-width: 800px;
}

thead th {
    padding: 7px 10px;
    text-align: right;
    color: #666;
    font-weight: 500;
    border-bottom: 1px solid #2a2a2a;
    background: #111;
    position: sticky;
    top: 0;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
}

thead th:first-child { text-align: left; }

tbody td {
    padding: 6px 10px;
    text-align: right;
    border-bottom: 1px solid #1a1a1a;
    white-space: nowrap;
}

tbody td:first-child { text-align: left; }

tbody tr:hover { background: #1a1a1a; }

.positive { color: #4CAF50; }
.negative { color: #f44336; }
.neutral  { color: #aaa; }

/* Editable cell */
.editable {
    cursor: pointer;
    border-bottom: 1px dashed #444;
    display: inline-block;
    min-width: 40px;
    text-align: right;
}
.editable:hover { border-bottom-color: #5499ff; color: #fff; }

.edit-input {
    background: #1a2535;
    border: 1px solid #5499ff;
    color: #fff;
    padding: 2px 5px;
    border-radius: 3px;
    font-size: 11px;
    width: 70px;
    text-align: right;
}

.remove-btn {
    background: none;
    border: none;
    color: #555;
    cursor: pointer;
    font-size: 13px;
    padding: 0 4px;
}
.remove-btn:hover { color: #f44336; }

input[type=checkbox] {
    accent-color: #5499ff;
    cursor: pointer;
}

/* Error */
.error-bar {
    background: rgba(244,67,54,0.15);
    border: 1px solid #f44336;
    color: #f44336;
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 4px;
    margin-top: 4px;
    display: none;
}
.error-bar.show { display: block; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #111; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #444; }
</style>
</head>
<body>

<!-- ===== TOOLBAR ===== -->
<div class="toolbar">
    <span class="toolbar-title">⚡ Simulated PNL Chart</span>

    <div class="currency-group">
        <button class="currency-btn active" data-cur="USD">⊙ USD</button>
        <button class="currency-btn" data-cur="ETH">◉ ETH</button>
    </div>

    <select class="view-select" id="viewSelect">
        <option value="pnl">PNL ▾</option>
    </select>

    <button class="recenter-btn" id="recenterBtn">Recenter Chart</button>

    <!-- Time slider section -->
    <div class="time-section">
        <div class="date-badge" id="startDateBadge">05-04-2026 📅</div>
        <div class="time-slider-track">
            <input type="range" id="timeSlider" min="0" max="100" value="0">
        </div>
        <div class="date-badge" id="endDateBadge">10-04-2026 📅</div>
    </div>

    <!-- Vol shift -->
    <div class="shift-group">
        <span>-70%</span>
        <input type="range" class="shift-slider" id="volSlider" min="-70" max="200" value="0">
        <span>200%</span>
        <span class="shift-value">Vol: <b id="volValue">0%</b></span>
    </div>

    <!-- Rate shift -->
    <div class="shift-group">
        <span>-20%</span>
        <input type="range" class="shift-slider" id="rateSlider" min="-20" max="20" value="0">
        <span>20%</span>
        <span class="shift-value">Rate: <b id="rateValue">0%</b></span>
    </div>
</div>

<!-- ===== MAIN ===== -->
<div class="main">

    <!-- LEFT PANEL -->
    <div class="left-panel">
        <div>
            <div class="panel-label">Expiry</div>
            <div class="date-tabs" id="dateTabs">
                <div class="date-tab active" data-exp="ALL">All</div>
            </div>
        </div>

        <div>
            <div class="panel-label">Instrument</div>
            <input type="text" class="search-input" id="searchInput" placeholder="Search...">
        </div>

        <div class="instrument-list" id="instrumentList">
            <div style="padding:10px; color:#555; font-size:12px;">Loading...</div>
        </div>

        <div>
            <div class="panel-label">Amount</div>
            <input type="number" class="amount-input" id="amountInput" value="1" step="0.1" min="0.1">
        </div>

        <div style="display:flex; gap:8px;">
            <button class="btn-long" id="longBtn">Long</button>
            <button class="btn-short" id="shortBtn">Short</button>
        </div>

        <div class="error-bar" id="errorBar"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
        <div class="chart-wrap">
            <canvas id="pnlChart"></canvas>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th style="text-align:left; width:20px;"></th>
                        <th style="text-align:left;">Instrument</th>
                        <th>Amount</th>
                        <th>Avg Price</th>
                        <th>Mark Price</th>
                        <th>PNL ($)</th>
                        <th>IV</th>
                        <th>Delta</th>
                        <th>Vega</th>
                        <th>Theta</th>
                        <th style="width:30px;"></th>
                    </tr>
                </thead>
                <tbody id="posTable">
                    <tr><td colspan="11" style="text-align:center; color:#444; padding:20px;">No positions — select an instrument and click Long or Short</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
